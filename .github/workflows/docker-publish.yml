name: Publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          # The first two workflow runs predate automatic versioning.
          # Every subsequent push to main increments the patch version:
          # 1.1.1, 1.1.2, 1.1.3, ...
          PATCH=$((GITHUB_RUN_NUMBER - 2))
          VERSION="1.1.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --list 'v1.1.*' --sort=-v:refname | head -n 1)

          {
            echo "## Cambios en esta versión"
            echo

            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --pretty=format:'- %s (`%h`)' --no-merges
            else
              git log -n 10 --pretty=format:'- %s (`%h`)' --no-merges
            fi

            echo
            echo
            echo "## Docker"
            echo
            echo "Imagen de esta versión:"
            echo
            echo '```text'
            echo "ghcr.io/rit4lin/sestibalsa-monitor:${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Última versión estable:"
            echo
            echo '```text'
            echo "ghcr.io/rit4lin/sestibalsa-monitor:latest"
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sestibalsa-monitor
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=1.1
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Sestibalsa Monitor
            org.opencontainers.image.description=Monitor de turnos de Sestibalsa para Docker y Home Assistant
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sestibalsa Monitor ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
